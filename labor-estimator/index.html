<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Labor Estimator</title>

  <style>

  </style>
</head>

<body>
  <article class="shop-labor-estimator">
    <h1>Labor Estimate</h1>
    <label for="labor-inp">Labor Hours:</label>
    <input type="number" class="shop-labor-estimator__input" id="labor-inp">
    <label for="hourly-inp">Hourly Rate ($):</label>
    <input type="number" class="shop-labor-estimator__input" id="hourly-inp">
    <label for="parts-inp">Parts Cost ($):</label>
    <input type="number" class="shop-labor-estimator__input" id="parts-inp">
    <button class="shop-labor-estimator__button" id="estimate-btn">Get Estimate</button>
    <p class="shop-labor-estimator__output" id="labor-disp"></p>
    <p class="shop-labor-estimator__output" id="parts-disp"></p>
    <p class="shop-labor-estimator__output" id="tax-disp"></p>
    <p class="shop-labor-estimator__output" id="total-disp"></p>
    <p class="shop-labor-estimator__validation-output" id="validation-disp"></p>
  </article>

  <script>
    const laborInput = document.getElementById('labor-inp');
    const hourlyInput = document.getElementById('hourly-inp');
    const partsInput = document.getElementById('parts-inp');
    const estimateButton = document.getElementById('estimate-btn');
    const laborOutput = document.getElementById('labor-disp');
    const partsOutput = document.getElementById('parts-disp');
    const taxOutput = document.getElementById('tax-disp');
    const totalOutput = document.getElementById('total-disp');
    const validationMessage = document.getElementById('validation-disp');
    const taxRate = 0.0775;

    estimateButton.addEventListener('click', function() {
      const laborConvNum = Number(laborInput.value);
      const hourlyConvNum = Number(hourlyInput.value);
      const partsConvNum = Number(partsInput.value);

      if (isNaN(laborConvNum) || laborConvNum <0.1 || isNaN(hourlyConvNum) || hourlyConvNum <= 0 || partsInput.value === '' || isNaN(partsConvNum) || partsConvNum <0) {
        validationMessage.textContent = 'Please enter a valid number!';
      } else {
        const laborSubtotal = laborConvNum * hourlyConvNum;
        const taxAmount = taxRate * partsConvNum;
        const finalTotal = laborSubtotal + partsConvNum + taxAmount;
        laborOutput.textContent = `Labor: $${laborSubtotal.toFixed(2)}`;
        partsOutput.textContent = `Parts: $${partsConvNum.toFixed(2)}`;
        taxOutput.textContent = `Tax: $${taxAmount.toFixed(2)}`;
        totalOutput.textContent = `Total: $${finalTotal.toFixed(2)}`;
    }});
  </script>
</body>
</html>
